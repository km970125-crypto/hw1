<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹彈珠：打磚塊</title>
    <style>
        * { box-sizing: border-box; }
        :root { color-scheme: dark; --ink: #f5f7ff; --muted: #9ca9c7; --cyan: #56f4ee; --pink: #ff4eb8; }
        body { margin: 0; min-height: 100vh; padding: 30px 20px 24px; color: var(--ink); font-family: "Trebuchet MS", "Microsoft JhengHei", sans-serif; background: radial-gradient(ellipse at 50% 0%, #263052 0, #14182e 38%, #090b16 82%); }
        main { width: min(100%, 1000px); margin: 0 auto; }
        .masthead { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin: 0 4px 18px; }
        .eyebrow { margin: 0 0 5px; color: var(--cyan); font-size: 11px; font-weight: 800; letter-spacing: .18em; }
        h1 { margin: 0; font-size: clamp(25px, 5vw, 38px); line-height: 1; }
        .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 13px; }
        .tools { display: flex; align-items: center; gap: 8px; }
        button { font: inherit; cursor: pointer; }
        .icon-button { width: 42px; height: 42px; display: grid; place-items: center; border: 1px solid #414b68; border-radius: 8px; color: white; background: #171d32; font-size: 18px; }
        .icon-button:hover { border-color: var(--cyan); color: var(--cyan); }
        .scoreboard { display: grid; grid-template-columns: repeat(4, 1fr); margin-bottom: 12px; border-top: 1px solid #333b56; border-bottom: 1px solid #333b56; background: #111629a8; }
        .stat { min-width: 0; padding: 11px 16px 10px; border-right: 1px solid #333b56; }
        .stat:last-child { border: 0; }
        .stat span { display: block; margin-bottom: 2px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .14em; }
        .stat strong { font-size: 20px; font-variant-numeric: tabular-nums; }
        .stat:nth-child(1) strong { color: #f5f7ff; }
        .stat:nth-child(2) strong { color: #ffda61; }
        .stat:nth-child(3) strong { color: #ff70ca; }
        .stat:nth-child(4) strong { color: #73f5da; }
        .frame { padding: 8px; border: 1px solid #48516d; border-radius: 12px; background: linear-gradient(135deg, #3d4664, #171d31 34%, #303956 70%, #14192a); box-shadow: 0 22px 70px #0008, inset 0 1px #ffffff25; }
        .screen { position: relative; overflow: hidden; border: 1px solid #60708f; border-radius: 6px; background: #0b1023; box-shadow: inset 0 0 28px #000b; }
        canvas { display: block; width: 100%; height: auto; aspect-ratio: 8 / 5; touch-action: none; }
        #overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px; text-align: center; background: #080d1dc4; backdrop-filter: blur(5px); }
        #overlay.hidden { display: none; }
        .dialog { max-width: 440px; animation: enter .35s ease-out both; }
        .dialog h2 { margin: 0; color: #fff; font-size: clamp(28px, 6vw, 48px); text-shadow: 0 0 24px #ff4eb877; }
        .dialog p { color: #cad2e7; font-size: 14px; line-height: 1.75; }
        #start { margin-top: 6px; border: 0; border-radius: 7px; padding: 12px 26px; color: #101324; background: linear-gradient(100deg, #6ffff0, #ffe36e 52%, #ff70c9); box-shadow: 0 0 25px #56f4ee55; font-size: 15px; font-weight: 900; }
        #start:hover { filter: brightness(1.12); transform: translateY(-1px); }
        .foot { display: flex; justify-content: space-between; gap: 15px; margin: 12px 4px 0; color: var(--muted); font-size: 12px; }
        .foot strong { color: #e5eafa; font-weight: 600; }
        @keyframes enter { from { opacity: 0; transform: translateY(9px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @media (max-width: 560px) {
            body { padding: 22px 10px 18px; }
            .masthead { align-items: center; margin-bottom: 14px; }
            .subtitle { max-width: 230px; font-size: 11px; }
            .icon-button { width: 38px; height: 38px; }
            .stat { padding: 9px 8px; }
            .stat strong { font-size: 17px; }
            .stat span { font-size: 9px; letter-spacing: .08em; }
            .frame { padding: 5px; }
            .foot { flex-wrap: wrap; font-size: 11px; }
        }
    </style>
</head>
<body>
    <main>
        <header class="masthead">
            <div><p class="eyebrow">ARCADE / A7</p><h1>霓虹彈珠</h1><p class="subtitle">瞄準反彈角度，把整座霓虹磚牆打亮。</p></div>
            <div class="tools"><button class="icon-button" id="pause" type="button" aria-label="暫停" title="暫停 (P)">Ⅱ</button><button class="icon-button" id="sound" type="button" aria-label="關閉音效" title="音效開關">♫</button></div>
        </header>
        <section class="scoreboard" aria-label="遊戲狀態">
            <div class="stat"><span>SCORE</span><strong id="score">00000</strong></div>
            <div class="stat"><span>BEST</span><strong id="best">00000</strong></div>
            <div class="stat"><span>生命</span><strong id="lives">3</strong></div>
            <div class="stat"><span>關卡</span><strong id="level">01</strong></div>
        </section>
        <div class="frame"><div class="screen">
            <canvas id="game" width="960" height="600" aria-label="霓虹彈珠打磚塊遊戲區"></canvas>
            <section id="overlay"><div class="dialog"><h2 id="title">準備開打？</h2><p id="message">移動底板接住彈珠，撞碎所有霓虹磚塊！<br>留意磚塊的立體斜面，漂亮反彈就能連擊。</p><button id="start" type="button">開始遊戲</button></div></section>
        </div></div>
        <footer class="foot"><span><strong>移動</strong> ← → / A D / 滑鼠 / 觸控　 <strong>發球</strong> 空白鍵　 <strong>暫停</strong> P</span><span>每次反彈，都是下一次連擊的起點。</span></footer>
    </main>
    <script>
    (() => {
        const canvas = document.querySelector('#game'), ctx = canvas.getContext('2d');
        const overlay = document.querySelector('#overlay'), startButton = document.querySelector('#start');
        const keys = {}, colors = ['#ff557a', '#ff8b50', '#ffd95b', '#9cf65c', '#4ce6d5', '#b179ff'];
        const bestKey = 'a7-neon-breaker-best';
        let paddle, ball, bricks = [], particles = [], trails = [], score = 0, lives = 3, level = 1;
        let mode = 'ready', started = false, soundOn = true, audio, lastTime = 0, pointerX = null;
        let best = Number(localStorage.getItem(bestKey)) || 0;

        function tone(freq, duration, type = 'sine', volume = .035, endFreq = freq) {
            if (!soundOn) return;
            try {
                audio ||= new (window.AudioContext || window.webkitAudioContext)();
                if (audio.state === 'suspended') audio.resume();
                const oscillator = audio.createOscillator(), gain = audio.createGain();
                oscillator.type = type;
                oscillator.frequency.setValueAtTime(freq, audio.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(Math.max(1, endFreq), audio.currentTime + duration);
                gain.gain.setValueAtTime(volume, audio.currentTime);
                gain.gain.exponentialRampToValueAtTime(.001, audio.currentTime + duration);
                oscillator.connect(gain); gain.connect(audio.destination);
                oscillator.start(); oscillator.stop(audio.currentTime + duration);
            } catch (_) { /* Audio is optional. */ }
        }
        function updateHud() {
            document.querySelector('#score').textContent = String(score).padStart(5, '0');
            document.querySelector('#best').textContent = String(best).padStart(5, '0');
            document.querySelector('#lives').textContent = lives;
            document.querySelector('#level').textContent = String(level).padStart(2, '0');
        }
        function makeBricks() {
            bricks = [];
            const columns = 9, rows = 6, width = 83, height = 25, gapX = 10, gapY = 10;
            const startX = (960 - columns * width - (columns - 1) * gapX) / 2;
            for (let row = 0; row < rows; row++) for (let column = 0; column < columns; column++) {
                bricks.push({ x: startX + column * (width + gapX), y: 82 + row * (height + gapY), w: width, h: height, color: colors[row], hp: row < 2 && (column + row) % 3 === 0 ? 2 : 1, alive: true });
            }
        }
        function resetBall() {
            paddle = { x: 480, y: 548, w: 126, h: 17, speed: 560 };
            ball = { x: paddle.x, y: paddle.y - 17, r: 9, vx: 0, vy: 0, speed: 390 };
        }
        function newGame() {
            score = 0; lives = 3; level = 1; started = true;
            makeBricks(); particles = []; trails = []; resetBall(); updateHud(); launch();
        }
        function launch() {
            if (mode === 'paused') { mode = 'playing'; overlay.classList.add('hidden'); return; }
            ball.x = paddle.x; ball.y = paddle.y - 18;
            const angle = (Math.random() * .5 - .25) * Math.PI;
            ball.vx = Math.sin(angle) * ball.speed;
            ball.vy = -Math.cos(angle) * ball.speed;
            mode = 'playing'; overlay.classList.add('hidden'); tone(480, .12, 'triangle', .045, 760);
        }
        function showOverlay(heading, message, label) {
            document.querySelector('#title').textContent = heading;
            document.querySelector('#message').innerHTML = message;
            startButton.textContent = label;
            overlay.classList.remove('hidden');
        }
        function endGame(won) {
            mode = won ? 'won' : 'over';
            showOverlay(won ? '漂亮通關！' : '彈珠落地了', `本次得分：${score}<br>${won ? '霓虹磚牆已清空，再挑戰一次！' : '再來一局，試著打出更高連擊。'}`, '再玩一次');
            tone(won ? 620 : 230, .48, won ? 'triangle' : 'sawtooth', .055, won ? 1040 : 65);
        }
        function burst(x, y, color, amount = 10) {
            for (let i = 0; i < amount; i++) {
                const angle = Math.random() * Math.PI * 2, speed = 75 + Math.random() * 230;
                particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, life: .35 + Math.random() * .45, max: .8, color, size: 2 + Math.random() * 3 });
            }
        }
        function movePaddle(dt) {
            if (pointerX !== null) paddle.x += (pointerX - paddle.x) * Math.min(1, dt * 16);
            else {
                if (keys.ArrowLeft || keys.KeyA) paddle.x -= paddle.speed * dt;
                if (keys.ArrowRight || keys.KeyD) paddle.x += paddle.speed * dt;
            }
            paddle.x = Math.max(34 + paddle.w / 2, Math.min(926 - paddle.w / 2, paddle.x));
            if (mode !== 'playing') { ball.x = paddle.x; ball.y = paddle.y - 18; }
        }
        function update(dt) {
            movePaddle(dt);
            particles.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .985; p.vy = p.vy * .985 + 90 * dt; p.life -= dt; });
            particles = particles.filter(p => p.life > 0);
            trails.forEach(t => t.life -= dt); trails = trails.filter(t => t.life > 0);
            if (mode !== 'playing') return;
            ball.x += ball.vx * dt; ball.y += ball.vy * dt;
            trails.push({ x: ball.x, y: ball.y, life: .23 }); if (trails.length > 12) trails.shift();
            if (ball.x - ball.r < 35) { ball.x = 35 + ball.r; ball.vx = Math.abs(ball.vx); tone(250, .045, 'sine', .018, 320); }
            if (ball.x + ball.r > 925) { ball.x = 925 - ball.r; ball.vx = -Math.abs(ball.vx); tone(250, .045, 'sine', .018, 320); }
            if (ball.y - ball.r < 33) { ball.y = 33 + ball.r; ball.vy = Math.abs(ball.vy); tone(260, .05, 'sine', .018, 340); }
            if (ball.vy > 0 && ball.y + ball.r >= paddle.y - paddle.h / 2 && ball.y - ball.r <= paddle.y + paddle.h / 2 && Math.abs(ball.x - paddle.x) < paddle.w / 2 + ball.r) {
                const offset = Math.max(-1, Math.min(1, (ball.x - paddle.x) / (paddle.w / 2)));
                const angle = offset * 1.05;
                ball.vx = Math.sin(angle) * ball.speed; ball.vy = -Math.cos(angle) * ball.speed;
                ball.y = paddle.y - paddle.h / 2 - ball.r;
                tone(360 + Math.abs(offset) * 200, .09, 'triangle', .04, 600 + Math.abs(offset) * 240);
            }
            for (const brick of bricks) {
                if (!brick.alive) continue;
                const nearX = Math.max(brick.x, Math.min(ball.x, brick.x + brick.w));
                const nearY = Math.max(brick.y, Math.min(ball.y, brick.y + brick.h));
                const dx = ball.x - nearX, dy = ball.y - nearY;
                if (dx * dx + dy * dy > ball.r * ball.r) continue;
                if (Math.abs(dx) > Math.abs(dy)) ball.vx *= -1; else ball.vy *= -1;
                brick.hp--;
                if (!brick.hp) {
                    brick.alive = false; score += 10 * level; burst(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.color, 13);
                    if (score > best) { best = score; localStorage.setItem(bestKey, best); }
                } else { burst(ball.x, ball.y, brick.color, 5); }
                updateHud(); tone(brick.hp ? 350 : 520 + (5 - Math.floor(brick.y / 35)) * 65, .07, 'square', .028, brick.hp ? 210 : 210);
                break;
            }
            if (ball.y > 620) {
                lives--; updateHud(); tone(190, .28, 'sawtooth', .05, 60);
                if (lives <= 0) endGame(false);
                else { resetBall(); mode = 'ready'; showOverlay('再接一球！', `剩下 ${lives} 次機會，接住彈珠繼續連擊。`, '繼續挑戰'); }
            }
            if (bricks.every(brick => !brick.alive)) {
                level++;
                if (level > 3) endGame(true);
                else { ball.speed += 35; makeBricks(); resetBall(); mode = 'ready'; updateHud(); showOverlay(`第 ${level} 關`, '磚牆重新排列了，繼續保持漂亮的反彈！', '進入下一關'); tone(620, .28, 'triangle', .045, 980); }
            }
        }
        function roundedRect(x, y, w, h, r) {
            ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
        }
        function drawBrick(b) {
            ctx.save(); ctx.shadowColor = b.color; ctx.shadowBlur = 13;
            const gradient = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
            gradient.addColorStop(0, '#ffffff'); gradient.addColorStop(.16, b.color); gradient.addColorStop(1, b.color);
            roundedRect(b.x, b.y, b.w, b.h - 5, 5); ctx.fillStyle = gradient; ctx.fill(); ctx.shadowBlur = 0;
            ctx.beginPath(); ctx.moveTo(b.x + 4, b.y + b.h - 5); ctx.lineTo(b.x + b.w - 3, b.y + b.h - 5); ctx.lineTo(b.x + b.w - 8, b.y + b.h); ctx.lineTo(b.x, b.y + b.h); ctx.closePath(); ctx.fillStyle = '#11162c'; ctx.fill();
            ctx.beginPath(); ctx.moveTo(b.x + b.w - 2, b.y + 4); ctx.lineTo(b.x + b.w, b.y + 8); ctx.lineTo(b.x + b.w, b.y + b.h); ctx.lineTo(b.x + b.w - 6, b.y + b.h); ctx.closePath(); ctx.fillStyle = '#ffffff55'; ctx.fill();
            ctx.fillStyle = '#ffffffaa'; ctx.fillRect(b.x + 8, b.y + 4, b.w - 22, 2);
            if (b.hp > 1) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x + b.w - 12, b.y + 10, 3, 0, Math.PI * 2); ctx.fill(); }
            ctx.restore();
        }
        function draw() {
            ctx.clearRect(0, 0, 960, 600);
            const bg = ctx.createLinearGradient(0, 25, 0, 590); bg.addColorStop(0, '#141934'); bg.addColorStop(.56, '#10152b'); bg.addColorStop(1, '#090e20');
            ctx.fillStyle = bg; ctx.fillRect(0, 0, 960, 600);
            ctx.save(); ctx.strokeStyle = '#83a0ff0c'; ctx.lineWidth = 1;
            for (let i = 0; i < 15; i++) { const x = 480 + (i - 7) * 64; ctx.beginPath(); ctx.moveTo(480 + (x - 480) * .12, 32); ctx.lineTo(x, 572); ctx.stroke(); }
            for (let y = 100; y < 590; y += 48) { ctx.beginPath(); ctx.moveTo(36, y); ctx.lineTo(924, y); ctx.stroke(); }
            ctx.restore();
            ctx.fillStyle = '#65eaff'; ctx.shadowColor = '#65eaff'; ctx.shadowBlur = 12; ctx.fillRect(34, 34, 3, 530); ctx.fillRect(923, 34, 3, 530); ctx.shadowBlur = 0;
            ctx.fillStyle = '#d8dfff55'; ctx.font = '10px Trebuchet MS'; ctx.textAlign = 'left'; ctx.fillText('NEON ZONE', 48, 53); ctx.textAlign = 'right'; ctx.fillText(`LEVEL ${String(level).padStart(2, '0')}`, 912, 53);
            bricks.forEach(brick => { if (brick.alive) drawBrick(brick); });
            trails.forEach(t => { ctx.globalAlpha = t.life / .23 * .48; ctx.fillStyle = '#7ffff2'; ctx.beginPath(); ctx.arc(t.x, t.y, ball.r * (t.life / .23), 0, Math.PI * 2); ctx.fill(); }); ctx.globalAlpha = 1;
            particles.forEach(p => { ctx.globalAlpha = Math.min(1, p.life / .18); ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 10; ctx.fillRect(p.x, p.y, p.size, p.size); }); ctx.globalAlpha = 1; ctx.shadowBlur = 0;
            const paddleGradient = ctx.createLinearGradient(paddle.x, paddle.y - 12, paddle.x, paddle.y + 9); paddleGradient.addColorStop(0, '#fff'); paddleGradient.addColorStop(.22, '#69fff1'); paddleGradient.addColorStop(1, '#17aeca');
            ctx.shadowColor = '#44f9ee'; ctx.shadowBlur = 22; roundedRect(paddle.x - paddle.w / 2, paddle.y - paddle.h / 2, paddle.w, paddle.h, 8); ctx.fillStyle = paddleGradient; ctx.fill(); ctx.shadowBlur = 0;
            ctx.fillStyle = '#ffffff'; ctx.fillRect(paddle.x - paddle.w * .27, paddle.y - 5, paddle.w * .54, 2);
            const ballGradient = ctx.createRadialGradient(ball.x - 3, ball.y - 4, 1, ball.x, ball.y, ball.r + 2); ballGradient.addColorStop(0, '#fff'); ballGradient.addColorStop(.38, '#e7fffb'); ballGradient.addColorStop(1, '#55f2e9');
            ctx.fillStyle = ballGradient; ctx.shadowColor = '#8ffff5'; ctx.shadowBlur = 20; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
            if (mode === 'paused') { ctx.fillStyle = '#080d1d99'; ctx.fillRect(35, 35, 890, 530); }
        }
        function loop(time) {
            const dt = Math.min(.032, (time - (lastTime || time)) / 1000); lastTime = time;
            update(dt); draw(); requestAnimationFrame(loop);
        }
        function setPointer(event) {
            const rect = canvas.getBoundingClientRect();
            pointerX = (event.clientX - rect.left) * 960 / rect.width;
        }
        startButton.addEventListener('click', () => {
            if (mode === 'paused') { launch(); return; }
            if (started && mode === 'ready') { launch(); return; }
            newGame();
        });
        document.querySelector('#pause').addEventListener('click', () => {
            if (mode === 'playing') { mode = 'paused'; showOverlay('暫停中', '準備好了就回到球場。', '繼續遊戲'); }
            else if (mode === 'paused') launch();
        });
        document.querySelector('#sound').addEventListener('click', event => {
            soundOn = !soundOn; event.currentTarget.textContent = soundOn ? '♫' : '♪';
            event.currentTarget.setAttribute('aria-label', soundOn ? '關閉音效' : '開啟音效');
            if (soundOn) tone(660, .1);
        });
        canvas.addEventListener('pointermove', setPointer);
        canvas.addEventListener('pointerdown', event => { setPointer(event); if (mode === 'ready' && started) launch(); });
        canvas.addEventListener('pointerleave', () => { pointerX = null; });
        window.addEventListener('keydown', event => {
            if (['ArrowLeft', 'ArrowRight', 'Space'].includes(event.code)) event.preventDefault();
            keys[event.code] = true;
            if (event.code === 'Space' && (mode === 'ready' || mode === 'paused')) launch();
            if (event.code === 'KeyP') {
                if (mode === 'playing') { mode = 'paused'; showOverlay('暫停中', '準備好了就回到球場。', '繼續遊戲'); }
                else if (mode === 'paused') launch();
            }
        });
        window.addEventListener('keyup', event => { keys[event.code] = false; });
        makeBricks(); resetBall(); updateHud(); requestAnimationFrame(loop);
    })();
    </script>
</body>
</html>
